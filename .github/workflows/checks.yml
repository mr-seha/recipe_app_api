on: [push]
jobs:
  test-lint:
    name: test and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{secrets.DOCKERHUB_USER }}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: checkout
        uses: actions/checkout@v2
      - name: Test
        run: docker compose run --rm app python3 manage.py test
      - name: lint
        run: docker compose run --rm app ruff check --no-cache .
